# Hyprlock configuration - Gruvbox Dark theme
# Matches Hyprland configuration style and colors

$font = Libre Baskerville 

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeInOutCufbic, 0.65, 0, 0.35, 1
    animation = fadeIn, 1, 6, easeInOutCubic
    animation = fadeOut, 1, 6, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeInOutCubic
}

background {
    monitor =
    path = /home/jasko/Imagens/Cat_at_Play.png
    color = rgba(0, 0, 0, 0.5)
    blur_size = 1
    blur_passes = 1
    noise = 0.050
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    inner_color = rgba(40, 40, 40, 0.7)
    
    outer_color = rgba(163, 104, 56, 0)     # Gruvbox orange (#fe8019)
    check_color = rgba(187, 119, 56, 0)     # Gruvbox green (#b8bb26) 
    fail_color = rgba(251, 72, 52, 0)       # Gruvbox red (#fb4934)
    inner_color = rgba(40, 40, 40, 0)       # Gruvbox bg0 (#282828) with opacity
    font_color = rgba(168, 153, 132, 0.12)  # Gruvbox light fg (#ebdbb2)
    fade_on_empty = true

    capslock_color = -1

    font_family = 1
    dots_size = 0.05
    dots_rounding = -2
    placeholder_text = 
    fail_text = 

    dots_spacing = 0.8
    dots_center = false
    
    position = 20, 110
    halign = left
    valign = bottom
    
    # 🌟 Configuração de Sombra para Input Field 🌟
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1
}

# Time display
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font, Bold Italic
    color = rgb(235, 219, 178)                # Gruvbox light fg

    position = -45, -10
    halign = right
    valign = top

    # 🌟 Configuração de Sombra para Label (Time) 🌟
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(75, 75, 75, 0.06)
    shadow_boost = 1
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 24
    font_family = $font
    color = rgb(168, 153, 132)                # Gruvbox light4 (#a89984)

    position = -55, -110
    halign = right
    valign = top
    
    # 🌟 Configuração de Sombra para Label (Date) 🌟
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(51, 50, 50, 0.06)
    shadow_boost = 1
}

# 1. Título da Música
label {
    monitor =
    
    text = cmd[update:1000] playerctl -p spotify metadata title | tr '[:upper:]' '[:lower:]'
    font_size = 24
    font_family = Lora, Italic
    color = rgb(168, 153, 132)   

    position = 30, 20
    halign = left
    valign = bottom
    
    # 🌟 Configuração de Sombra para Label (Title) 🌟
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(54, 54, 54, 0.06)
    shadow_boost = 1
}

# 2. Artista da Música
label {
    monitor =
    text = cmd[update:1000] playerctl -p spotify metadata artist | tr '[:upper:]' '[:lower:]'
    font_size = 50
    font_family = $font, Bold Italic
    color = rgb(235, 219, 178)                # Gruvbox light fg

    position = 30, 45
    halign = left
    valign = bottom
    
    # 🌟 Configuração de Sombra para Label (Artist) 🌟
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(70, 70, 70, 0.06)
    shadow_boost = 1
}
