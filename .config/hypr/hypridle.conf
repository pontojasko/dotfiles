# ~/.config/hypr/hypridle.conf

general {
    # Comando a ser executado quando o sistema for bloqueado por D-Bus (ex: loginctl lock-session)
    # Garante que hyprlock é iniciado se ainda não estiver rodando
    lock_cmd = pidof hyprlock || hyprlock 
    
    # Comando para bloquear antes de suspender/hibernar (MANTENHA ISSO)
    before_sleep_cmd = loginctl lock-session
    
    # Comando para ligar o DPMS (Display Power Management Signaling) ao sair da suspensão
    after_sleep_cmd = hyprctl dispatch dpms on 
}

# 1️⃣ Listener 1: Desliga o monitor (DPMS off) primeiro (ex: após 5 minutos)
# Ação: Economia de energia
listener {
    # Tempo de inatividade em segundos (300 segundos = 5 minutos)
    timeout = 900
    
    # Comando a ser executado quando o tempo limite for atingido: Desliga o monitor
    on-timeout = hyprctl dispatch dpms off
    
    # Comando a ser executado ao retomar a atividade: Liga o monitor
    on-resume = hyprctl dispatch dpms on 
}

# 2️⃣ Listener 2: Bloqueia a tela depois (ex: 1 minuto depois)
# Ação: Segurança
listener {
    # Tempo de inatividade em segundos (360 segundos = 6 minutos)
    # Deve ser MAIOR que o timeout do DPMS off
    timeout = 1200 
    
    # Comando a ser executado: Bloqueia a sessão (o lock_cmd chama o hyprlock)
    on-timeout = loginctl lock-session
    
    # Não precisa de on-resume aqui, pois o hyprlock já exige senha para retomar.
    # on-resume = 
}