# =================================================================
# boring jasko dots uWU
# =================================================================

# =================================================================
# 1. MONITOR & VARIÁVEIS PRINCIPAIS
# =================================================================
monitor = ,preferred,auto,1

# --- Programs Variables ---
$terminal    = alacritty
$fileManager = nemo
$menu        = rofi -show combi
$browser     = brave
$editor      = code
$mainMod     = SUPER
$gemini      = /opt/brave-bin/brave --profile-directory=Default --app-id=caidcmannjgahlnbpmidmiecjcoiiigg

# =================================================================
# 2. CURSOR & AMBIENTE
# =================================================================
# --- Suas Configurações Originais ---

env = GTK_USE_PORTAL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_MENU_PREFIX,arch-
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1


env = XDG_SESSION_TYPE,wayland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWS_DECORATION,1


# 1. Força apps Electron (VS Code, Brave, Discord) a rodarem nativos em Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# 2. Garante compatibilidade visual para aplicações Java
env = _JAVA_AWT_WM_NONREPARENTING,1

# 3. Prioriza Wayland para apps QT
env = QT_QPA_PLATFORM,wayland;xcb

# 4. Ajuste automático de escala para telas QT
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# 5. Define backend Wayland para jogos e emuladores (SDL)
env = SDL_VIDEODRIVER,wayland

# 6. Backend para bibliotecas Clutter
env = CLUTTER_BACKEND,wayland

# 7. Garante que browsers baseados em Mozilla usem Wayland
env = MOZ_ENABLE_WAYLAND,1

# =================================================================
# 3. INPUT
# =================================================================
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    force_no_accel = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# =================================================================
# 4. APARÊNCIA (GENERAL, DECORATION, ANIMATIONS)
# =================================================================
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(91911bff)
    col.inactive_border = rgba(3b4252ff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 1

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        color = rgba(050000aa)
        range = 2
        render_power = 1
        offset = 0 0
        ignore_window = true
        scale = 1
    }
}

animations {
    enabled = true

    animation = layersIn, 0, 0, 5, bezier, fade
    animation = layersOut, 0, 0, 5, bezier, fade

    animation = windows, 1, 1, default, slide
    animation = workspaces, 1 1, default
    animation = specialWorkspace, 0, 0, default
    animation = border, 1, 1, default
    animation = borderangle, 1, 1, default
    
}

# =================================================================
# 5. LAYOUTS & MISC
# =================================================================
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    mfact = 0.5
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# =================================================================
# 6. WINDOW & WORKSPACE RULES
# =================================================================

# Workspace Persistence (Geralmente não mudou, mas verifique se há erros)
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true

# Workspace Specifics
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# =================================================================
# NOVA SINTAXE DE WINDOW RULES
# =================================================================

# "noborder" virou "border_size 0"
windowrule = border_size 0, match:workspace w[t1]

# Regras de Janela Flutuante (Requer "on")
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# Regra de Opacidade (floating:1 virou match:float 1)
windowrule = opacity 1 0.7, match:float 1

# =================================================================
# ATRIBUIÇÃO DE WORKSPACES
# =================================================================

windowrule = workspace 4 silent, match:class ^(jetbrains-idea)$

# FIX PARA O VS CODE (Tente esta regex mais flexível se ele não estiver indo)
windowrule = workspace 4, match:class (?i)code.*

windowrule = workspace 3 silent, match:class ^(spotify)$
windowrule = workspace 2 silent, match:class ^(ZapZap)$
windowrule = workspace 5 silent, match:class ^(org.telegram.desktop)$

# =================================================================
# REGRAS JETBRAINS (Múltiplos matches na mesma linha)
# =================================================================

windowrule = center on, match:class ^(jetbrains-.*)$, match:float 1
windowrule = float on, match:class ^(jetbrains-.*)$, match:title ^(splash)$
windowrule = center on, match:class ^(jetbrains-.*)$, match:title ^(splash)$
windowrule = stay_focused on, match:class ^(jetbrains-.*)$, match:float 1

# [NOTION / LOTION CONFIG]
windowrule = workspace special:notion silent, match:class ^(Lotion)$
windowrule = tile on, match:class ^(Lotion)$

# =================================================================
# XWAYLAND VIDEO BRIDGE (Corrigido e separado)
# =================================================================
# maxsize agora pede largura E altura (1 1)
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
# =================================================================
# 7. KEYBINDS (ATALHOS)
# =================================================================

# No hyprland.conf
# Garante que o Notion sempre abra no workspace especial de forma silenciosa e em modo tiling
# 1. Manda o Notion para o "limbo" (Special Workspace) ao abrir, sem tirar seu foco
# [NOTION / LOTION CONFIG]
windowrulev2 = workspace special:notion silent, class:^(Lotion)$
windowrulev2 = tile, class:^(Lotion)$

# Atalho para TRAZER o Notion (Sempre dividindo a tela)
bind = $mainMod, N, movetoworkspace, current, class:^(Lotion)$
bind = $mainMod, N, setfloating, class:^(Lotion)$
bind = $mainMod, N, togglefloating, class:^(Lotion)$
bind = $mainMod, N, focuswindow, class:^(Lotion)$

# --- Core Bindings ---
bind = $mainMod, Q, exec, if [ "$(hyprctl activewindow -j | jq -r .class)" = "Lotion" ]; then hyprctl dispatch movetoworkspacesilent special:notion,address:$(hyprctl activewindow -j | jq -r .address); else hyprctl dispatch killactive; fi
bind = $mainMod, W, exec, if [ "$(hyprctl activewindow -j | jq -r .class)" = "Lotion" ]; then hyprctl dispatch movetoworkspacesilent special:notion,address:$(hyprctl activewindow -j | jq -r .address); else hyprctl dispatch killactive; fi
bind = $mainMod, M, exec, hyprctl dispatch exit
bind = $mainMod Ctrl, W, exec, pkill -SIGUSR1 waybar
bind = $mainMod Ctrl, I, exec, intellij-idea-ultimate-edition
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, C, togglefloating,
bind = ALT, TAB, togglefloating,
bind = $mainMod, X, pseudo,
bind = $mainMod, D, togglesplit,
bind = $mainMod, Escape, exec, hyprlock

# --- Application Launchers (Using Variables) ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, G, exec, $gemini
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager

bind = $mainMod SHIFT, E, exec, $editor   # Agora usa a variável $editor (VS Code)

# Launcher Menu (Rofi/Wofi)
bindr = $mainMod, Super_L, exec, pkill rofi || $menu

# --- Clipboard ---
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns 2 -config ~/.config/rofi/config.rasi | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl

# --- Focus Movement ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# --- Window Movement ---I
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Resize Windows ---
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

bind = $mainMod CTRL, Left, resizeactive, -40 0
bind = $mainMod CTRL, Right, resizeactive, 40 0
bind = $mainMod CTRL, Up, resizeactive, 0 -40
bind = $mainMod CTRL, Down, resizeactive, 0 40

# --- Workspace Switching ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Navegação sequencial

bind = $mainMod , mouse_down, workspace, e+1
bind = $mainMod , mouse_up, workspace, e-1
bind = CTRL ALT, Right, workspace, e+1
bind = CTRL ALT, Left, workspace, e-1


# Scroll through workspaces
bind = $mainMod CTRL, mouse_down, movetoworkspace, e+1
bind = $mainMod CTRL, mouse_up, movetoworkspace, e-1



# --- Move Window to Workspace ---
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# --- Special Workspaces (Scratchpad) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# --- Screenshots & OCR ---
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod SHIFT MOD1, S, exec, grim -g "$(slurp)" /tmp/ocr.png && tesseract /tmp/ocr.png - | wl-copy && notify-send "OCR" "texto copiado" || notify-send "OCR" "falha ao extrair texto"
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod, R, exec, ~/.config/hypr/scripts/gravar_tela.sh

# --- Hardware Keys (Audio & Brightness) ---
binde = $mainMod, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = $mainMod, F10, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = $mainMod SHIFT, equal, exec, brightnessctl set 5%+
binde = $mainMod SHIFT, minus, exec, brightnessctl set 5%-

# --- Media Control Global ---
bindl = , XF86AudioPlay, exec,s playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, ddcutil setvcp 10 + 5
binde = , XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 5

# =================================================================
# 8. SUBMAPS (MODOS ESPECIAIS)
# =================================================================
submap = spotify_menu

# DENTRO deste modo:
bindr = $mainMod, L, exec, pkill eww || $menu
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = , Escape, exec, eww close spotify_control && hyprctl dispatch submap reset
bind = $mainMod, Q, exec, eww close spotify_control && hyprctl dispatch submap reset
bind = , Space, exec, playerctl -p spotify play-pause

submap = reset

# =================================================================
# 9. AUTOSTART (INICIALIZAÇÃO)
# =================================================================

# --- Serviços de Base (Essenciais) ---
exec-once = gsettings set org.gnome.desktop.interface file-chooser-backend 'gio'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec-once = xdg-mime default nemo.desktop inode/directory application/x-gnome-saved-search
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/hypr/scripts/init_portals.sh
exec-once = /usr/lib/pam_kwallet_init &

# --- Interface e Firulas ---

exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Ice"
exec-once = swww-daemon
exec-once = waybar
exec-once = dunst
exec-once = hypridle

# --- Utilitários de Background ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/eww/scripts/autoclose.hypr.sh &
exec-once = ~/.config/hypr/scripts/workspace_listener.sh &

# --- Apps com Delay (Para evitar gargalo no boot) ---
exec-once = sleep 1.5 && zapzap
exec-once = sleep 1.5 && spotify-launcher
exec-once = sleep 3 && swww img ~/Imagens/Cat_at_Play.png
exec-once = sleep 4 && lotion
# kbuildsycoca atualiza o cache de apps do KDE, 1 vez é suficiente
exec-once = sleep 5 && kbuildsycoca6